    - g++ --version
    - mkdir build && cd build
    - cmake .. -DCMAKE_BUILD_TYPE=Release
    - cmake --build .
    - ctest --output-on-failure
    - ./benchmark

x86-clang-nosph_legendre:
    stage: build
    image: debian:bookworm
    tags:
        - linux_x86
    script:
        - apt-get -qq update && apt-get -qq install --no-install-recommends -y --quiet ca-certificates cmake clang git make libgsl-dev libboost-math-dev
        - clang --version
        - mkdir build && cd build
        - CXXFLAGS="-O3 -pipe -Wall -Werror -Wno-error=deprecated-declarations"
        - CXX=clang++ CC=clang cmake .. -DCMAKE_BUILD_TYPE=Release
        - cmake --build .
        - ctest --output-on-failure

